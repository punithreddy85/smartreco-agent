[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartreco_agent"]

[project]
name = "smartreco-agent"
version = "0.1.0"
description = "SmartReco \u2014 a behavioral AI recommendation agent for an online course marketplace"
readme = "README.md"
keywords = ["agent", "recommendation", "rag", "langgraph", "fastapi"]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "starlette==0.46.2",
    "uvicorn[standard]==0.32.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "pydantic==2.11.5",
    "pydantic-core==2.33.2",
    "pydantic-settings==2.9.1",
    "email-validator==2.2.0",
    "python-dotenv==1.1.0",
    "structlog>=24.1.0",
    "itsdangerous==2.2.0",
    "argon2-cffi==23.1.0",
    "psycopg[binary,pool]==3.2.9",
    "pgvector==0.3.6",
    "numpy==2.2.6",
    "openai>=1.55.0",
    "langgraph==0.4.7",
    "langgraph-checkpoint==2.0.26",
    "langchain-core==0.3.63",
    "resend==2.8.0",
    "httpx==0.28.1",
    "tenacity==9.1.2",
    "typing-extensions==4.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.0.0",
    "pytest-cov==6.2.1",
    "ruff==0.12.2",
    "mypy==1.16.1",
    "pre-commit==4.2.0",
    "httpx==0.28.1",
]

[project.scripts]
smartreco-agent = "smartreco_agent.src.main:main"

[project.urls]
Homepage = "https://github.com/punithreddy85/smartreco-agent"
Repository = "https://github.com/punithreddy85/smartreco-agent"
Issues = "https://github.com/punithreddy85/smartreco-agent/issues"

[tool.ruff]
target-version = "py312"
line-length = 88
lint.select = ["E", "W", "F", "I", "F401"]
lint.ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = ["asyncio"]

[tool.coverage.run]
source = ["smartreco_agent"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
