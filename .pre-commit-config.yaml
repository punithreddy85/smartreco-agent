repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.2
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^tests/
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests]

  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        # This is an internal application, not a published library: mandating a
        # docstring on every private route handler / DB helper (D10x) is noise,
        # not signal. D205/D209/D415/D403 are also disabled because this codebase
        # consistently wraps a docstring's opening sentence across two lines
        # before the blank line - readable, just not what strict PEP257 expects.
        args:
          - --convention=google
          - --add-ignore=D100,D101,D102,D103,D104,D105,D107,D205,D209,D403,D415
        exclude: ^tests/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [ "-lll" ] # only report high severity
        exclude: ^tests/
