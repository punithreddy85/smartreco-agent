# Local development and reviewer reproducibility (ARCHITECTURE.md §12.3).
# In production the same code runs on Vercel against Supabase Postgres instead -
# this compose file exists so a reviewer needs nothing but Docker + a Mesh API key.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smartreco-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartreco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Plain .sql files here are run once, in filename order, on first init only.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Containerfile
    container_name: smartreco-app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/smartreco
      DB_DISABLE_PREPARE: "false"
      APP_BASE_URL: http://localhost:${AGENT_PORT:-8000}
    ports:
      - "${AGENT_PORT:-8000}:${AGENT_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn smartreco_agent.src.api:app --host 0.0.0.0 --port ${AGENT_PORT:-8000} --reload
    volumes:
      - ./smartreco_agent:/app/smartreco_agent
      - ./scripts:/app/scripts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${AGENT_PORT:-8000}/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
